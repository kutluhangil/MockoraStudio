<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Built by kutluhangil">
<style>
.bg{animation:bg 12s linear infinite}
@keyframes bg{0%,8%{fill:#f3efe9}28%{fill:#3d3530}48%,80%{fill:#0b0a09}90%,100%{fill:#f3efe9}}
.ink{animation:ink 12s linear infinite}
@keyframes ink{0%,8%{fill:#26211d}28%{fill:#f8f3ec}48%,80%{fill:#f2ece4}90%,100%{fill:#26211d}}
.rule{animation:rule 12s linear infinite}
@keyframes rule{0%,8%{stroke:#26211d33}28%{stroke:#f8f3ec33}48%,80%{stroke:#f2ece433}90%,100%{stroke:#26211d33}}
.muted{opacity:.7}
.sig{fill:transparent;stroke:#d4af6a;stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900;animation:sig 12s ease-in-out infinite}
@keyframes sig{0%{stroke-dashoffset:900;fill:transparent}30%{stroke-dashoffset:0;fill:transparent}40%,86%{stroke-dashoffset:0;fill:#d4af6a}96%,100%{stroke-dashoffset:900;fill:transparent}}
.glint{animation:glint 6s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes glint{0%{transform:translateX(-200px)}100%{transform:translateX(1200px)}}
.dot{animation:dot 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dot{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.5);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sig{stroke-dashoffset:0;fill:#d4af6a}}
</style>
<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#d4af6a" stop-opacity="0"/><stop offset=".5" stop-color="#e8e2d6"/><stop offset="1" stop-color="#8fb3ff" stop-opacity="0"/></linearGradient></defs>
<rect class="bg" width="1200" height="170" rx="24" fill="#f3efe9"/>
<text class="ink muted" x="600" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="4">DESIGNED · BUILT · SHIPPED BY</text>
<text class="sig" x="600" y="108" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="58" letter-spacing="1">kutluhangil</text>
<line class="rule" x1="380" y1="128" x2="820" y2="128"/>
<rect class="glint" x="0" y="126.5" width="200" height="3" rx="1.5" fill="url(#sg)"/>
<circle class="dot" cx="372" cy="128" r="3" fill="#e8e2d6"/><circle class="dot" cx="828" cy="128" r="3" fill="#8fb3ff" style="animation-delay:1.2s"/>
<text class="ink muted" x="600" y="154" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="3">ISTANBUL · REBUILDREBREAK · 2026</text>
</svg>
