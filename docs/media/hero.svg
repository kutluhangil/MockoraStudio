<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Mockora Studio — AI product mockups in the browser">
<style>
.bg{animation:bg 12s linear infinite}
@keyframes bg{0%,8%{fill:#f3efe9}28%{fill:#3d3530}48%,80%{fill:#0b0a09}90%,100%{fill:#f3efe9}}
.ink{animation:ink 12s linear infinite}
@keyframes ink{0%,17.5%{fill:#26211d}18.5%,28%{fill:#f8f3ec}48%,84.5%{fill:#f2ece4}85.5%,100%{fill:#26211d}}
.rule{animation:rule 12s linear infinite}
@keyframes rule{0%,17.5%{stroke:#26211d33}18.5%,28%{stroke:#f8f3ec33}48%,84.5%{stroke:#f2ece433}85.5%,100%{stroke:#26211d33}}
.muted{opacity:.74}
.stars{animation:stars 12s linear infinite}
@keyframes stars{0%,8%{opacity:0}28%{opacity:.2}48%,80%{opacity:.85}90%,100%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.bezel{animation:bezel 12s linear infinite}
@keyframes bezel{0%,8%{fill:#fffaf6}28%{fill:#5a2c45}48%,80%{fill:#20121b}90%,100%{fill:#fffaf6}}
.scr{animation:scr 12s linear infinite}
@keyframes scr{0%,8%{fill:#fff3ee}28%{fill:#3a1b2c}48%,80%{fill:#140a12}90%,100%{fill:#fff3ee}}
.rowbg{animation:rowbg 12s linear infinite}
@keyframes rowbg{0%,8%{fill:#2a142010}28%{fill:#fff0f512}48%,80%{fill:#ffffff0c}90%,100%{fill:#2a142010}}
.pill{animation:pill 12s linear infinite}
@keyframes pill{0%,8%{fill:#2a14200d}28%{fill:#fff0f51a}48%,80%{fill:#ffffff12}90%,100%{fill:#2a14200d}}
.toast{animation:toast 12s linear infinite}
@keyframes toast{0%,8%{fill:#ffffff}28%{fill:#4a2238}48%,80%{fill:#26121e}90%,100%{fill:#ffffff}}
.edge{animation:edge 12s linear infinite}
@keyframes edge{0%,8%{stroke:#2a142024}28%{stroke:#fff0f526}48%,80%{stroke:#ffffff1f}90%,100%{stroke:#2a142024}}
.shade{animation:shade 12s linear infinite}
@keyframes shade{0%,8%{fill-opacity:.10}28%{fill-opacity:.22}48%,80%{fill-opacity:.45}90%,100%{fill-opacity:.10}}
.lit{filter:drop-shadow(0 0 3px currentColor)}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ping{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.gt{animation:gt 12s cubic-bezier(.3,1.3,.5,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes gt{0%{opacity:0;transform:scale(.85)}38.3%{opacity:0;transform:scale(.85)}41.2%{opacity:1;transform:none}43.3%{opacity:1;transform:none}46.3%{opacity:0;transform:scale(.85)}100%{opacity:0;transform:scale(.85)}}
.lg{animation:lg 12s cubic-bezier(.5,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes lg{0%{transform:translate(60px,-40px) scale(1.4) rotate(0deg);opacity:0}5%{transform:translate(60px,-40px) scale(1.4) rotate(0deg);opacity:1}13.3%{transform:translate(0,0) scale(1.4) rotate(0deg);opacity:1}21.7%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}30%{transform:translate(0,0) scale(1) rotate(-6deg);opacity:1}96.7%{transform:translate(0,0) scale(1) rotate(-6deg);opacity:1}100%{transform:translate(60px,-40px) scale(1.4);opacity:0}}
.bb{animation:bb 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes bb{0%{opacity:0;transform:none}13.3%{opacity:0;transform:none}16.3%{opacity:1;transform:none}36.7%{opacity:1;transform:none}39.6%{opacity:0;transform:none}100%{opacity:0;transform:none}}
.sg{animation:sg 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes sg{0%{opacity:0;transform:none}16.7%{opacity:0;transform:none}19.6%{opacity:1;transform:none}25%{opacity:1;transform:none}27.9%{opacity:0;transform:none}100%{opacity:0;transform:none}}
.wp{animation:wp 12s cubic-bezier(.6,0,.3,1) infinite;transform-box:fill-box;transform-origin:left}
@keyframes wp{0%{transform:scaleX(0)}46.7%{transform:scaleX(0)}60%{transform:scaleX(1)}95%{transform:scaleX(1)}98.3%{transform:scaleX(0)}100%{transform:scaleX(0)}}
.ba{animation:ba 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes ba{0%{opacity:0;transform:none}60%{opacity:0;transform:none}62.9%{opacity:1;transform:none}95%{opacity:1;transform:none}97.9%{opacity:0;transform:none}100%{opacity:0;transform:none}}
.ready{animation:ready 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes ready{0%{opacity:0;transform:translateY(-14px)}61.7%{opacity:0;transform:translateY(-14px)}64.6%{opacity:1;transform:none}88.3%{opacity:1;transform:none}91.3%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
