<text class="ink" x="60" y="282" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="78" letter-spacing="-1">Studio.</text>
<text class="ink muted" x="64" y="336" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="20">Premium mockups. Blazing fast.</text>
